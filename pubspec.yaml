name: mintmusic
description: "薄荷音乐 - A Flutter music player replicating CeruMusic for Android"
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  go_router: ^14.8.1

  just_audio: ^0.9.46
  just_audio_background: 0.0.1-beta.11
  audio_service: ^0.18.18
  audio_session: ^0.1.25

  dio: ^5.8.0+1

  permission_handler: ^11.4.0
  file_picker: ^9.2.3

  path_provider: ^2.1.5
  path: ^1.9.1

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cached_network_image: ^3.4.1

  shared_preferences: ^2.5.3

  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  convert: ^3.1.2
  archive: ^4.0.4
  on_audio_query: ^2.9.0
  flutter_js: ^0.8.7
  xml: ^6.5.0
  palette_generator: ^0.3.3+4
  gbk_codec: ^0.4.0
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  record: ^5.2.1
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

dependency_overrides:
  record_linux: ^1.3.1
  # url_launcher_android >= 6.3.26 requires AGP 8.9.1+ (androidx.core 1.17.0 / browser 1.9.0),
  # which exceeds this project's AGP 8.6.0 / Android Studio support range.
  url_launcher_android: 6.3.25

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/afp/
    - assets/amll/amll-bundle.js
    - assets/amll/amll-core.css
    - assets/amll/lyric_player.html
    - assets/fonts/PingFangSC-Semibold.woff2

  fonts:
    - family: lyricfont
      fonts:
        - asset: assets/fonts/lyricfont.ttf
