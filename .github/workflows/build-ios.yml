name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Disable code signing
        run: |
          cp ios/Flutter/Debug.xcconfig ios/Flutter/Debug.xcconfig.bak 2>/dev/null || true
          cp ios/Flutter/Release.xcconfig ios/Flutter/Release.xcconfig.bak 2>/dev/null || true
          printf '#include "Generated.xcconfig"\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=""\nCODE_SIGN_STYLE=Manual\nDEVELOPMENT_TEAM=""\nPROVISIONING_PROFILE=""\n' > ios/Flutter/NoCodesign.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Debug.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Build iOS archive
        run: flutter build ipa --release --no-codesign

      - name: Verify archive exists
        run: |
          echo "=== Checking archive ==="
          ls -la build/ios/archive/Runner.xcarchive/ 2>/dev/null
          ls -la build/ios/archive/Runner.xcarchive/Products/ 2>/dev/null

      - name: Export IPA from archive
        run: |
          mkdir -p build/ios/ipa

          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>teamID</key>
            <string></string>
            <key>signingCertificate</key>
            <string>-</string>
          </dict>
          </plist>
          EOF

          echo "=== Running xcodebuild -exportArchive ==="
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" 2>&1

          EXPORT_EXIT=$?
          echo ""
          echo "=== Export exit code: $EXPORT_EXIT ==="
          echo ""
          echo "=== build/ios/ipa/ contents ==="
          ls -laR build/ios/ipa/ 2>/dev/null || echo "Directory empty or not found"

      - name: Restore xcconfig
        if: always()
        run: |
          cp ios/Flutter/Debug.xcconfig.bak ios/Flutter/Debug.xcconfig 2>/dev/null || true
          cp ios/Flutter/Release.xcconfig.bak ios/Flutter/Release.xcconfig 2>/dev/null || true
          rm -f ios/Flutter/Debug.xcconfig.bak ios/Flutter/Release.xcconfig.bak

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-ios-unsigned
          path: build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
