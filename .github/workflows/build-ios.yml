name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Disable code signing
        run: |
          cp ios/Flutter/Debug.xcconfig ios/Flutter/Debug.xcconfig.bak 2>/dev/null || true
          cp ios/Flutter/Release.xcconfig ios/Flutter/Release.xcconfig.bak 2>/dev/null || true
          printf '#include "Generated.xcconfig"\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=""\nCODE_SIGN_STYLE=Manual\nDEVELOPMENT_TEAM=""\nPROVISIONING_PROFILE=""\n' > ios/Flutter/NoCodesign.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Debug.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Debug Flutter build ipa help
        run: flutter build ipa -h 2>&1 | grep -E "no-codesign|export|method" || true

      - name: Build iOS IPA
        id: build_ipa
        run: |
          flutter build ipa --release --no-codesign 2>&1 | tee build.log
          echo "Exit code: $?"
          
      - name: Debug - list build outputs
        if: always()
        run: |
          echo "=== build/ios/ contents ==="
          ls -laR build/ios/ 2>/dev/null | head -50 || echo "build/ios/ not found"
          echo ""
          echo "=== Searching for .ipa files ==="
          find . -name "*.ipa" -type f 2>/dev/null || echo "No .ipa files found"
          echo ""
          echo "=== Searching for .xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null || echo "No .xcarchive found"
          echo ""
          echo "=== Last 30 lines of build.log ==="
          tail -30 build.log 2>/dev/null || echo "No build.log"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-ios-unsigned
          path: |
            build/ios/ipa/*.ipa
            build/ios/iphoneos/*.ipa
            **/*.ipa
          retention-days: 7
          if-no-files-found: warning

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
