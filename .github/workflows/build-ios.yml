name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      # Override xcconfig to fully disable code signing for CI builds
      - name: Disable code signing
        run: |
          cp ios/Flutter/Debug.xcconfig ios/Flutter/Debug.xcconfig.bak 2>/dev/null || true
          cp ios/Flutter/Release.xcconfig ios/Flutter/Release.xcconfig.bak 2>/dev/null || true
          printf '#include "Generated.xcconfig"\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=""\nCODE_SIGN_STYLE=Manual\nDEVELOPMENT_TEAM=""\nPROVISIONING_PROFILE=""\n' > ios/Flutter/NoCodesign.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Debug.xcconfig
          echo '#include "NoCodesign.xcconfig"' > ios/Flutter/Release.xcconfig

      - name: Build iOS (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Find produced IPA
        run: |
          echo "=== Looking for IPA file ==="
          # Flutter may place IPA at various paths; list all candidates
          find . -name "*.ipa" -type f 2>/dev/null | head -10
          echo "=== IPA search complete ==="

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mintmusic-ios-unsigned
          # Upload whatever IPA was found; if none, this will fail gracefully
          path: |
            **/*.ipa
          retention-days: 7
          if-no-files-found: error